org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Release version for both apps: versionCode counts releases (the Android versionCode is
# 100 times it, and the GitHub tag is "v<that>", e.g. v2800), versionName is the release
# title the desktop updater compares. Bump both for every release.
grooveo.versionCode=28
grooveo.versionName=0.7.0
# 0 for a release; 1..99 for a test build before it (versionCode (release-1)*100 + n, name "-test.n")
grooveo.testBuild=5
